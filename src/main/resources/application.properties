# Application Configuration
spring.application.name=clinic-management
server.port=8080

# Cấu hình HashiCorp Vault (Quản lý thông tin mật tập trung)
vault.uri=http://localhost:8200
vault.token=careplus-root-token
vault.secret-path=secret/data/clinic-management

# Database Configuration (Username & Password được nạp tự động từ HashiCorp Vault, có cấu hình dự phòng)
spring.datasource.url=jdbc:mysql://localhost:3306/clinic_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Tungthinh2002@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# Cấu hình Keycloak OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/clinic-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/clinic-realm/protocol/openid-connect/certs

# Địa chỉ Kafka Broker
spring.kafka.bootstrap-servers=localhost:9092

# Cấu hình Producer (Bắn tin nhắn)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Cấu hình Consumer (Lắng nghe tin nhắn)
spring.kafka.consumer.group-id=clinic-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer